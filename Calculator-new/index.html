
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
</head>

<body style="
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #f2f2f2;
    font-family: Arial, sans-serif;
">

    <div style="
        background-color: #222;
        padding: 20px;
        border-radius: 15px;
        width: 300px;
    ">

        <input
            type="text"
            id="display"
            readonly
            style="
                width: 100%;
                height: 60px;
                margin-bottom: 15px;
                box-sizing: border-box;
                font-size: 28px;
                text-align: right;
                padding: 10px;
            "
        >

        <div style="
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        ">

            <button onclick="clearDisplay()" style="height: 60px; font-size: 20px;">C</button>

            <button onclick="deleteLast()" style="height: 60px; font-size: 20px;">DEL</button>

            <button onclick="appendValue('%')" style="height: 60px; font-size: 20px;">%</button>

            <button onclick="appendValue('/')" style="height: 60px; font-size: 20px;">÷</button>

            <button onclick="appendValue('7')" style="height: 60px; font-size: 20px;">7</button>
            <button onclick="appendValue('8')" style="height: 60px; font-size: 20px;">8</button>
            <button onclick="appendValue('9')" style="height: 60px; font-size: 20px;">9</button>
            <button onclick="appendValue('*')" style="height: 60px; font-size: 20px;">×</button>

            <button onclick="appendValue('4')" style="height: 60px; font-size: 20px;">4</button>
            <button onclick="appendValue('5')" style="height: 60px; font-size: 20px;">5</button>
            <button onclick="appendValue('6')" style="height: 60px; font-size: 20px;">6</button>
            <button onclick="appendValue('-')" style="height: 60px; font-size: 20px;">−</button>

            <button onclick="appendValue('1')" style="height: 60px; font-size: 20px;">1</button>
            <button onclick="appendValue('2')" style="height: 60px; font-size: 20px;">2</button>
            <button onclick="appendValue('3')" style="height: 60px; font-size: 20px;">3</button>
            <button onclick="appendValue('+')" style="height: 60px; font-size: 20px;">+</button>

            <button onclick="appendValue('0')" style="height: 60px; font-size: 20px;">0</button>
            <button onclick="appendValue('.')" style="height: 60px; font-size: 20px;">.</button>

            <button
                onclick="calculate()"
                style="
                    height: 60px;
                    font-size: 20px;
                    grid-column: span 2;
                    background-color: #4CAF50;
                    color: white;
                    border: none;
                    border-radius: 8px;
                "
            >
                =
            </button>

        </div>
    </div>

    <script>
        const display = document.getElementById("display");

        function appendValue(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = "";
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        function calculate() {
            try {
                display.value = eval(display.value);
            } catch {
                display.value = "Error";
            }
        }
    </script>

</body>
</html>
