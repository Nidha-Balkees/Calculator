

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Calculator</title>

    <style>

        
        button {
            height: 60px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            background-color: peach;
            color: black;
        }

        .clear{
            background-color: mediumvioletred;
        }

        .delete{
            background-color: mediumvioletred;
        }

        .operator{
            background-color: mediumvioletred;
        }

        
        button:hover {
            background-color:lemonchiffon;
            color:black;
            transform: scale(1);z
        }

       
        button:active {
            transform: scale(0.90);
        }

        .clear:hover{
            background-color:red ;
            color: white;
            transform: scale(1);
        }

        .delete:hover{
            background-color: orangered;
            color:white;
            transform: scale(1);
        }

        .operator:hover{
            background-color:rosybrown;
            color: white;
            transform: scale(1);
        }



    </style>

</head>


<body style="
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color:floralwhite;
    color: black;
    font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
">


   
    <div style="
        background-color:pink;
        padding: 20px;
        border-radius: 15px;
        width: 300px;
    ">


       

        <input
            type="text"
            id="display"
            readonly
            style="
                width: 100%;
                height: 60px;
                margin-bottom: 15px;
                box-sizing: border-box;
                font-size: 28px;
                text-align: right;
                padding: 10px;
            "
        >


       

        <div style="
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        ">


           

            <button class="clear" onclick="clearDisplay()">
                C
            </button>

            <button class="delete" onclick="deleteLast()">
                DEL
            </button>

            <button class="operator" onclick="appendValue('%')">
                %
            </button>

            <button class="operator" onclick="appendValue('/')">
                ÷
            </button>


           
            <button onclick="appendValue('7')">
                7
            </button>

            <button onclick="appendValue('8')">
                8
            </button>

            <button onclick="appendValue('9')">
                9
            </button>

            <button class="operator" onclick="appendValue('*')">
                ×
            </button>


            
            <button onclick="appendValue('4')">
                4
            </button>

            <button onclick="appendValue('5')">
                5
            </button>

            <button onclick="appendValue('6')">
                6
            </button>

            <button class="operator" onclick="appendValue('-')">
                −
            </button>


            
            <button onclick="appendValue('1')">
                1
            </button>

            <button onclick="appendValue('2')">
                2
            </button>

            <button onclick="appendValue('3')">
                3
            </button>

            <button class="operator" onclick="appendValue('+')">
                +
            </button>


            

            <button onclick="appendValue('0')">
                0
            </button>

            <button onclick="appendValue('.')">
                .
            </button>

            <button
                onclick="calculate()"
                style="
                    grid-column: span 2;
                    background-color: #4CAF50;
                    color: white;
                "
            >
                =
            </button>


        </div>

    </div>


   
       
   <script src="script.js"></script>    


</body>

</html>
